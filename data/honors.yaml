items:
  - title: "ICTR 2026 Team Science Award"
    organization: "Johns Hopkins Institute for Clinical and Translational Research"
    year: "2026"
    summary: "Recognition of the Brain Health Program's interdisciplinary work connecting cognitive impairment, HIV, Long COVID, translational neuroscience, and data science."
    impact: "Highlights the collaborative infrastructure behind brain health discovery rather than a single isolated project."
  - title: "Howard E. Gendelman ISNV Pioneer in NeuroVirology Lectureship Award"
    organization: "International Society for NeuroVirology"
    year: "2016"
    summary: "Recognition connected to early contributions in neurovirology and translational neuroscience."
    impact: "Reflects the bridge between cellular neuroscience, neuroimmune mechanisms, and later computational brain health work."
  - title: "Sponsored Registration, SciPy Conference"
    organization: "SciPy"
    year: "2018"
    summary: "Support for participation in the scientific Python community."
    impact: "Connects the research program to open scientific computing and reproducible methods."
  - title: "Office of Graduate Studies Dissertation Fellowship"
    organization: "Drexel University"
    year: "2015"
    summary: "Graduate fellowship supporting dissertation work on axonal pathology in traumatic brain injury."
    impact: "Marks the engineering and cellular neuroscience foundation of the later translational program."
  - title: "Travel Award"
    organization: "National Neurotrauma Society"
    year: "2014"
    summary: "Recognition of early neurotrauma research."
    impact: "Highlights the axonal injury and neurodegeneration foundation behind the current brain health focus."
  - title: "Outstanding Graduate Student Paper and Poster Presentation"
    organization: "Northeastern Biomedical Engineering Conference"
    year: "2014"
    summary: "Early recognition for engineering-driven neuroscience research."
    impact: "Shows the long-running pattern of combining biomedical engineering, computation, and brain science."
