items:
  - title: "MEAnalyzer"
    capability: "Published, citable MATLAB app for multi-electrode array analysis."
    impact: "A downloadable point-and-click tool for spike-train statistics, burst detection, functional connectivity, periodicity analysis, visualization, and provenance-aware exports."
    url: "software/meanalyzer/"
    image: "media/software/meanalyzer/featured.png"
  - title: "SciDataReportR"
    capability: "Open-source biomedical data analysis and reporting infrastructure."
    impact: "Supports metadata-aware QC, statistical workflows, biomarker analysis, visualization, and reproducible scientific reasoning."
    url: "software/scidatareportr/"
    image: "media/software/scidatareportr/sticker.png"
  - title: "Computational Phenotyping Pipelines"
    capability: "Reveals latent cognitive and biomarker patterns across heterogeneous cohorts."
    impact: "Moves beyond average effects toward clinically and biologically interpretable hidden structure."
    url: "software/computational-phenotyping-pipelines/"
    image: "media/research-threads/computational-phenotyping-pipeline.png"
  - title: "Scientific Reporting Frameworks"
    capability: "Turns analysis workflows into publication-ready scientific reports."
    impact: "Makes reproducible research outputs traceable, interpretable, shareable, and ready for collaborators."
    url: "software/dashboards-reporting-frameworks/"
    image: "media/research-threads/reporting-framework-figure.png"
  - title: "ProteomicsReportR"
    capability: "In-development proteomics reporting workflows for multi-omics discovery."
    impact: "Designed to turn high-dimensional proteomics analyses into transparent QC, biomarker discovery, clustering, and interpretation reports."
    url: "software/proteomicsreportr/"
    image: "media/software/proteomicsreportr/sticker.png"
  - title: "MetabolomicsReportR"
    capability: "In-development metabolomics reporting for biomedical discovery."
    impact: "Designed for reproducible metabolomics reports that connect multi-omics measurements with statistical workflows and biological interpretation."
    url: "software/metabolomicsreportr/"
    image: "media/software/metabolomicsreportr/sticker.png"
  - title: "MultiPlexReportR"
    capability: "In-development multiplex biomarker reporting infrastructure."
    impact: "Designed for transparent QC, visualization, and biomarker discovery in multiplex translational studies."
    url: "software/multiplexreportr/"
    image: "media/software/multiplexreportr/sticker.png"
  - title: "SciDataAgent"
    capability: "Conceptual in-development human-in-the-loop AI reasoning layer."
    impact: "Frames conversational data exploration, transparent assumptions, and reproducible analysis planning as future scientific infrastructure."
    url: "software/scidataagent/"
    image: "media/software/scidataagent/sticker.png"
