    label: "Pillar 1"
    summary: "Machine learning, multimodal integration, disease subtyping, longitudinal prediction, and biomarker discovery for complex biomedical datasets."
  - title: "Scientific Software Infrastructure"
    label: "Pillar 2"
    summary: "Open-source software that translates published methods into reproducible analytical workflows, reports, and reusable research systems."
  - title: "Responsible AI-Assisted Science"
    label: "Pillar 3"
    summary: "Human-in-the-loop AI, conversational data exploration, scientific reasoning, and transparent workflows that help scientists think more effectively."
ecosystem:
  - title: "MEAnalyzer"
    status: "Published software"
    role: "Established MATLAB app"
    summary: "A citable and downloadable point-and-click graphical interface for multi-electrode array spike-train analysis, visualization, burst detection, connectivity metrics, and transparent exports."
    url: "/software/meanalyzer/"
  - title: "SciDataReportR"
    status: "Core framework"
    role: "Open-source analysis and reporting infrastructure"
    summary: "An open-source framework for reproducible biomedical data analysis and reporting across metadata-aware, quality-controlled, statistical, visual, and biomarker workflows."
    url: "/software/scidatareportr/"
    image: "/media/software/scidatareportr/sticker.png"
  - title: "Computational Phenotyping Pipelines"
    status: "Research infrastructure"
    role: "Hidden structure discovery"
    summary: "Reusable pipelines for machine learning, clustering, subgroup discovery, longitudinal prediction, and interpretable drivers of complex biomedical phenotypes."
    url: "/software/computational-phenotyping-pipelines/"
  - title: "Scientific Reporting Frameworks"
    status: "Research infrastructure"
    role: "Reproducible reporting"
    summary: "Reporting systems that carry data management, quality control, modeling, visualization, publication-ready outputs, sharing, review, and reproducibility through one workflow."
    url: "/software/dashboards-reporting-frameworks/"
  - title: "ProteomicsReportR"
    status: "In Development"
    role: "Proteomics reporting"
    summary: "Domain-specific reporting workflows for proteomics quality control, biomarker analysis, dimensionality reduction, clustering, and pathway-oriented interpretation."
    url: "/software/proteomicsreportr/"
    image: "/media/software/proteomicsreportr/sticker.png"
  - title: "MetabolomicsReportR"
    status: "In Development"
    role: "Metabolomics reporting"
    summary: "Reusable reports for metabolomics studies that connect multi-omics measurements with statistical workflows and biological interpretation."
    url: "/software/metabolomicsreportr/"
    image: "/media/software/metabolomicsreportr/sticker.png"
  - title: "MultiPlexReportR"
    status: "In Development"
    role: "Multiplex biomarker reporting"
    summary: "Analytical reporting infrastructure for multiplex biomarker panels, transparent QC, biomarker discovery, and cross-domain biomedical integration."
    url: "/software/multiplexreportr/"
    image: "/media/software/multiplexreportr/sticker.png"
  - title: "SciDataAgent"
    status: "In Development"
    role: "Conceptual AI reasoning layer"
    summary: "A conceptual human-in-the-loop assistant for conversational data exploration, scientific reasoning, reproducible analysis planning, and transparent hypothesis generation."
    url: "/software/scidataagent/"
    image: "/media/software/scidataagent/sticker.png"
