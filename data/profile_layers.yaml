training:
  - title: "B.S. Biomedical Engineering, minor in Computer Science"
    institution: "University of Virginia"
    blurb: "Engineering, computation, and biomedical problem solving."
    summary: "Early foundation in engineering, computation, and biomedical problem solving."
    logo: "/media/training-uva.png"
    logo_alt: "University of Virginia seal"
  - title: "Ph.D. Biomedical Engineering"
    institution: "Drexel University"
    blurb: "Axonal injury, mechanobiology, and quantitative experimentation."
    summary: "Dissertation work on mechanisms of secondary axonal pathology in traumatic brain injury."
    logo: "/media/training-drexel.png"
    logo_alt: "Drexel University badge"
  - title: "Postdoctoral training"
    institution: "Drexel University and Johns Hopkins Neurology"
    blurb: "Electrophysiology, neurons, organoids, and quantitative neuroscience."
    summary: "Quantitative neuroscience training across cellular mechanics, high-throughput electrophysiology, neurons, organoids, and brain slices."
    logo: "/media/training-drexel.png"
    logo_alt: "Drexel University badge"
  - title: "Faculty and translational data science"
    institution: "Johns Hopkins Neurology"
    blurb: "Cohort science, biomarkers, software, and responsible AI-assisted discovery."
    summary: "Translation of engineering and computational tools into human cohort studies, biomarker systems, open-source scientific software, and responsible AI-assisted discovery."
    logo: "/media/training-jhu.png"
    logo_alt: "Johns Hopkins University badge"
methods:
  - title: "R and reproducible reporting"
    summary: "Reusable analysis pipelines, dynamic reports, statistics, data checks, tables, and publication-ready scientific outputs."
  - title: "Machine learning and clustering"
    summary: "Self-organizing maps, dimensionality reduction, random forests, variable importance, and interpretable subgroup discovery."
  - title: "Data visualization"
    summary: "Interactive visualizations, dashboards, animated outputs, and scientific figures that make multidimensional results inspectable."
  - title: "MATLAB, GUI, and app development"
    summary: "MathWorks MATLAB, graphical interfaces, and user-friendly tools that let collaborators analyze data without needing to write every line of code themselves."
  - title: "High-throughput electrophysiology"
    summary: "Spike-train analytics, burst detection, functional connectivity, periodicity analysis, and MEA visualization."
  - title: "Network and biomarker analytics"
    summary: "Integrating molecular, imaging, cognitive, behavioral, multi-omics, and clinical signals into interpretable systems."
programs:
  - title: "NeuroHIV cognitive phenotyping"
    summary: "Data-driven models of cognitive heterogeneity in HIV, including sex-specific profiles, women with HIV, and longitudinal cognitive trajectories."
  - title: "Sleep, wearables, and chronobiology"
    summary: "Actigraphy, polysomnography summaries, wearable streams, and self-report data as modifiable determinants of neurocognition."
  - title: "Biomarker and neuroimaging integration"
    summary: "Multi-omics, inflammatory markers, blood-brain barrier imaging, neurofilament, GFAP, metabolomics, and cognition."
  - title: "Long COVID"
    summary: "Blood-brain barrier disruption, cognitive symptoms, biomarkers, and translational brain health."
  - title: "Digital biomarkers"
    summary: "Tablet-based cognitive testing, BRACE, reading-center workflows, and reproducible data processing."
  - title: "Electrophysiology"
    summary: "MEA systems, spike-train analysis, neuronal and organoid activity, and quantitative signal processing."
  - title: "Cellular systems and axonal injury"
    summary: "Engineering foundations in traumatic brain injury, axonal pathology, extracellular vesicles, astrocyte-neuron signaling, and MEA systems."
  - title: "Scientific software and open research infrastructure"
    summary: "Open-source software, AI-assisted discovery tools, and interfaces that make methods reusable, transparent, clinician-friendly, and accessible to interdisciplinary teams."
service:
  - title: "Scientific peer review"
    summary: "Peer review and scholarly service across computational biology, neurovirology, HIV/neuroimmune journals, and scientific computing."
  - title: "Open-source scientific community"
    summary: "Service to scientific Python/SciPy review tracks and community learning spaces where computational methods are shared."
  - title: "Graduate and educational leadership"
    summary: "Program-building roles in biomedical engineering graduate education and scientific training."
