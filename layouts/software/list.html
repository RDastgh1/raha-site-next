{{ define "main" }}
{{ partial "site-nav.html" . }}
{{ $ecosystem := hugo.Data.software_ecosystem }}
<main class="content-page content-page--wide software-index">
  <p class="raha-kicker">Scientific Software Ecosystem</p>
  <h1>{{ .Title }}</h1>
  {{ with .Content }}{{ . }}{{ end }}

  <section class="software-ecosystem software-directory" aria-label="Scientific software directory">
    <div class="software-directory__grid">
      {{ range $ecosystem.ecosystem }}
      <a class="ecosystem-node {{ if eq .status "In Development" }}ecosystem-node--development{{ else if eq .title "MEAnalyzer" }}ecosystem-node--core{{ else }}ecosystem-node--package{{ end }}" href="{{ .url | relURL }}">
        <span>{{ .status }}</span>
        <h2>{{ .title }}</h2>
        <strong>{{ .role }}</strong>
        <p>{{ .summary }}</p>
      </a>
      {{ end }}
    </div>
  </section>
</main>
{{ end }}
