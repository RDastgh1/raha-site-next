{{ define "main" }}
{{ partial "site-nav.html" . }}
<main class="content-page">
  <p class="raha-kicker">{{ .Section | default .Title }}</p>
  <h1>{{ .Title }}</h1>
  {{ with .Content }}{{ . }}{{ end }}
  <div class="raha-list">
    {{ range .Pages.ByDate.Reverse }}
    <a class="raha-list-item" href="{{ .RelPermalink }}">
      <div>
        <h3>{{ .Title }}</h3>
        <p>{{ .Params.summary | default .Summary }}</p>
      </div>
      <span>Open</span>
    </a>
    {{ end }}
  </div>
</main>
{{ end }}
