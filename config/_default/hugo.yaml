baseURL: "https://rdastgh1.github.io/raha-site-next/"
title: "Raha Dastgheyb"
locale: "en-us"
defaultContentLanguage: "en"
enableRobotsTXT: true
summaryLength: 24
ignoreFiles:
  - "data/publications/publications\\.bib$"
pagination:
  pagerSize: 12

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

outputs:
  home:
    - HTML
    - RSS

taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types

permalinks:
  publication: "/publication/:slug/"
  software: "/software/:slug/"
  talks: "/talks/:slug/"
  research: "/research/:slug/"
  research-threads: "/research-threads/:slug/"
  community: "/community/:slug/"
  leadership: "/leadership/:slug/"
  honors: "/honors/:slug/"
  people: "/people/:slug/"
  profile: "/profile/:slug/"
  methods: "/methods/:slug/"
  programs: "/programs/:slug/"

params:
  description: "Designing reproducible computational systems for translational brain health research."
  author: "Raha Dastgheyb"
  contact_email: ""
  theme: "raha-dark"
  color_scheme: "dark"
  default_appearance: "dark"
  day_night: true
  mainSections:
    - publication
    - software
    - talks
    - research
    - research-threads
    - methods
    - programs
